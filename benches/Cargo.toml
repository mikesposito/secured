[package]
name = "benches"
version = "0.0.0"
authors = ["mikesposito"]
license = "MIT"
description = "Criterion benchmarks of the secured crates"
edition = "2018"
publish = false

[dev-dependencies]
criterion = "0.5"
secured-enclave = { path = "../enclave/" }
secured-cipher = { path = "../cipher/" }

[[bench]]
name = "chacha20"
path = "src/chacha20.rs"
harness = false

[[bench]]
name = "chacha20-in-place"
path = "src/chacha20-in-place.rs"
harness = false

[[bench]]
name = "chacha20-blocks-per-thread"
path = "src/chacha20-blocks-per-thread.rs"
harness = false

[[bench]]
name = "cipher-signed-vs-unsigned"
path = "src/cipher-signed-vs-unsigned.rs"
harness = false
